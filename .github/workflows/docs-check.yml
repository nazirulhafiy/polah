# Watched paths (design/behaviour only; keep in sync with scripts/docs_check_pr.py
# and docs/ci-docs-check.md):
# - src/**/*.css
# - src/**/*.js
# - src/**/*.jsx
# - src/**/*.ts
# - src/**/*.tsx
#   except src/data/** and *.test.ts, *.test.tsx, *.test.js, *.test.jsx, *.test.mjs
# - server/**/*.js
# - server/**/*.ts
# - public/favicon.ico
# - public/favicon.svg
# - scripts/install-page.html
# - scripts/migrate.mjs
# - scripts/migration-plan.mjs
# - scripts/with-app-env.mjs
# - scripts/app-env-plugin.mjs
# - scripts/grok-pwa-plugin.mjs
# - scripts/grok-pwa-shared.mjs
# - scripts/grok-pwa-shared.d.mts
# - scripts/preview.mjs
# - scripts/check-analytics-dist.mjs
# - data/analytics.json
# - vite.config.ts
# - vercel.json
# Not watched: src/data/**, public/projects/**, public/og.jpg, public/sitemap.xml,
# public/robots.txt, migrations/**, tests/**, package.json, package-lock.json.
name: docs-check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  docs-check:
    name: docs-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pull request commits
        run: |
          git fetch --no-tags --prune origin \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Ensure no-docs-needed label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "no-docs-needed" \
            --description "Design or behaviour change needs no docs/ update" \
            --color "FEF2C0" \
            --force

      - name: Run docs check
        env:
          DOCS_CHECK_BASE: ${{ github.event.pull_request.base.sha }}
          DOCS_CHECK_HEAD: ${{ github.event.pull_request.head.sha }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python3 scripts/docs_check_pr.py
